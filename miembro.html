<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050814">
<title>Coheresencia · Mi práctica</title>
<link rel="icon" href="/media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 6px}
.top img{width:46px;height:auto}
.top h1{font-size:26px}
.top .chip{margin-left:auto;white-space:nowrap}
main{padding:12px 0 120px;display:grid;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,8,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:14px 2px 12px;font-size:12px;letter-spacing:.04em;color:var(--mute);cursor:pointer;position:relative}
.tabs button.on{color:var(--gold)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold);border-radius:2px}
.next{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.next .ph,.row .ph{border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--ink2)}
.next .ph img,.row .ph img{width:100%;height:100%;object-fit:cover}
.next h2{font-size:24px;margin:6px 0 4px}
.week{display:flex;justify-content:space-between;gap:6px;margin-top:14px}
.week span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.week i{display:block;width:100%;aspect-ratio:1;max-width:36px;margin:6px auto 0;border-radius:50%;border:1px solid var(--line)}
.week .on i{background:radial-gradient(circle,var(--gold),#b78a3f);border-color:var(--gold);box-shadow:0 0 14px rgba(227,189,114,.5)}
.week .today span,.week .today{color:var(--cream)}
.breathe{display:grid;place-items:center;text-align:center;padding:26px 20px}
.orb{width:120px;height:120px;border-radius:50%;margin:18px 0;display:grid;place-items:center;background:radial-gradient(circle,rgba(227,189,114,.55),rgba(227,189,114,.05) 70%);border:1px solid rgba(227,189,114,.5);transform:scale(.7);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1.15);transition-duration:4s}.orb.out{transform:scale(.7);transition-duration:6s}
.orb img{width:44px}
.path{position:relative;display:grid;gap:12px;padding-left:34px}
.path::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--gold),var(--line))}
.row{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;cursor:pointer;padding:12px}
.row .dot{position:absolute;left:-30px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:2px solid var(--line);display:grid;place-items:center;font-size:11px}
.row.done .dot{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.row.cur .dot{border-color:var(--gold);box-shadow:0 0 16px rgba(227,189,114,.7)}
.row.cur{border-color:rgba(227,189,114,.7);background:linear-gradient(160deg,rgba(227,189,114,.14),rgba(247,240,222,.03))}
.row.lock{opacity:.5}
.row h3{font-size:18px}
.row small{color:var(--mute);font-size:13px}
.row .go{font-size:20px;color:var(--gold)}
.row .sidestar{position:absolute;right:-6px;top:-18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:0;overflow:hidden;cursor:pointer}
.tile .ph{aspect-ratio:4/5;overflow:hidden}.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile div.t{padding:12px 14px 14px}.tile h3{font-size:17px}.tile small{color:var(--mute)}
.tile.done{border-color:rgba(227,189,114,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.sum .stats{align-content:center}.sumring{display:grid;place-items:center}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.door{display:grid;gap:4px;justify-items:start;text-align:left;padding:16px;cursor:pointer;color:inherit;transition:transform .3s,border-color .3s}.door:hover{transform:translateY(-2px);border-color:rgba(227,189,114,.5)}
.door b{font:300 22px/1.1 var(--serif)}.door small{font-size:12px}
.prof{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}.prof h2{font-size:24px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:300 24px var(--serif);color:var(--ink);background:linear-gradient(135deg,var(--gold),#b78a3f)}
.stats b{display:block;font:300 34px/1 var(--serif);color:var(--cream)}
.stats small{color:var(--mute);font-size:12px}
.ring{display:grid;place-items:center;margin:6px 0}
.sheet{position:fixed;inset:0;z-index:60;background:var(--ink);overflow:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.player{position:relative;aspect-ratio:4/5;max-height:62svh;width:100%;background:#000;overflow:hidden;display:grid;place-items:center;border-radius:0 0 22px 22px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.player .play{position:relative;width:72px;height:72px;border-radius:50%;background:rgba(247,240,222,.2);border:1px solid rgba(247,240,222,.6);backdrop-filter:blur(8px);cursor:pointer}
.player .play::before{content:"";position:absolute;left:29px;top:22px;border-style:solid;border-width:14px 0 14px 22px;border-color:transparent transparent transparent var(--cream)}
.player .close{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:2;background:rgba(5,8,20,.6);border:1px solid var(--line);border-radius:99px;color:var(--cream);padding:8px 16px;font-size:14px;cursor:pointer}
.player .tag{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;background:rgba(5,8,20,.65);padding:4px 12px;border-radius:99px;white-space:nowrap}
.sheet .body{max-width:560px;margin:0 auto;padding:22px 18px 40px;display:grid;gap:16px}
.sheet h2{font-size:30px}
.msg{padding:50px 0;text-align:center;display:grid;gap:16px;justify-items:center}
.msg h1{font-size:34px}
</style>
</head>
<body>
<div class="preview-note">Vista previa de diseño · el contenido es de ejemplo y los datos se guardan solo en este navegador</div>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Lección"></div>
<div class="toast" id="toast" role="status"></div>
<script src="/data.js"></script>
<script src="/pacer.js"></script>
<script src="/miembro.js"></script>
</body>
</html>
