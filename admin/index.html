<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Coheresencia · CRM</title>
<link rel="icon" href="/media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0}
.top img{width:42px}.top h1{font-size:24px;margin-right:auto}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;padding:12px 16px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;font-size:15px}
.tabs button.on{color:var(--gold);border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stats b{display:block;font:300 36px/1 var(--serif);color:var(--cream)}.stats small{color:var(--mute);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:10px 16px}
.pill{background:none;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--mute)}
.pill.on{border-color:var(--gold);color:var(--gold)}
.list{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;align-items:center;cursor:pointer;padding:14px 18px;transition:border-color .2s}
.mrow:hover{border-color:rgba(227,189,114,.6)}
.mrow b{font-weight:500}.mrow small{color:var(--mute);display:block}
.empty{text-align:center;padding:40px;color:var(--mute)}
dialog{background:var(--ink2);color:var(--cream);border:1px solid var(--line);border-radius:22px;padding:0;width:min(560px,94vw);max-height:92svh}
dialog::backdrop{background:rgba(5,8,20,.8);backdrop-filter:blur(6px)}
.dlg{padding:24px;display:grid;gap:14px}
.dlg h2{font-size:28px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--cream);width:100%}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.linkbox{font-size:13px;word-break:break-all;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.tr{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}.tr h2{font-size:24px}
\.les{display:flex;align-items:center;gap:12px;padding:12px 16px}.les>div:nth-of-type(1){flex:1;min-width:0}
.les .thumb{width:36px;height:48px;object-fit:cover;border-radius:8px}
.les .ic{padding:6px 10px}
.upbar{min-width:150px}.upbar small{font-size:12px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:6px}.gh.ok{border-color:rgba(159,201,138,.4)}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.mrow{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.les{flex-wrap:wrap}.les>div:nth-of-type(1){flex-basis:calc(100% - 60px)}}
</style>
</head>
<body>
<div class="preview-note">Vista previa de diseño · sin contraseña y con datos de ejemplo guardados solo en este navegador. La versión real tendrá inicio de sesión</div>
<div class="wrap">
  <header class="top"><img src="/media/logo-mark.png" alt=""><h1>CRM · Coheresencia</h1><button class="btn sm ghost" id="reset">Restablecer ejemplo</button><button class="btn sm" id="new">+ Nuevo miembro</button></header>
  <nav class="tabs"><button data-tab="miembros" class="on">Miembros</button><button data-tab="contenido">Contenido</button></nav>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/data.js"></script>
<script src="/admin/github.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
